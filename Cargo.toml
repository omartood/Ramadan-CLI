[package]
name = "cli-ramadam"
version = "0.1.0"
edition = "2021"
description = "A fast, offline-first Ramadan CLI for prayer times (Salaada) with themes and Somali support"
license = "MIT"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/yourusername/cli-ramadam"
keywords = ["ramadan", "prayer-times", "islamic", "cli", "salaada", "somalia"]
categories = ["command-line-utilities", "development-tools"]

# Binary name so `cargo install` gives you the `ramadan` command
[[bin]]
name = "ramadan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
toml = "0.8"
colored = "2.1"
